name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --group dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      # Gate 1 — dependances circulaires (backend). Le script construit le graphe
      # d'imports de `app` avec grimp et echoue (exit 1) sur tout cycle ABSENT du
      # baseline backend/import-cycles-baseline.json. Les cycles deja connus
      # (dette existante) sont toleres. Un step en echec fait echouer le job =>
      # le workflow Backend => bloque la PR. C'est l'autorite bloquante.
      - run: uv run python scripts/check_import_cycles.py

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --group dev

      - run: uv run mypy app/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --group dev

      - run: uv run pytest tests/ -v
