name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  # No paths filter on pull_request: every PR must report every gate, otherwise a PR
  # that touches only docs or a workflow stays stuck on "Expected" once the checks are required.
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Backend · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --group dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  typecheck:
    name: Backend · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --group dev

      - run: uv run mypy app/

  test:
    name: Backend · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --group dev

      - run: uv run pytest tests/ -v
