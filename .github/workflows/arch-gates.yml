# Import cycles and layer contracts, backend and frontend. The gate logic comes from
# claude-config at the pinned tag; this repo only declares backend/arch-gates.json,
# frontend/.dependency-cruiser.cjs and the baselines next to them.
name: arch-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  arch-python:
    uses: RemiAsselin42/claude-config/.github/workflows/arch-gates-python.yml@v3
    with:
      config: backend/arch-gates.json
  arch-frontend:
    uses: RemiAsselin42/claude-config/.github/workflows/arch-gates-frontend.yml@v3
    with:
      dir: frontend
