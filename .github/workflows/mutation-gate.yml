# Mutation testing on the backend: the mutants the tests do not kill may only shrink.
# The gate logic comes from claude-config at the pinned tag; this repo only declares
# what to mutate ([tool.mutmut] in backend/pyproject.toml) and keeps
# backend/mutation-baseline.json. mutmut refuses native Windows: this job is where
# the gate runs.
#
# No paths filter on pull_request: the check is required on main, and a required
# check that never reports leaves the PR "Expected", blocked for good. The run takes
# about ten seconds; it is cheaper than a PR nobody can merge.
name: mutation-gate
on:
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**"]
permissions:
  contents: read
jobs:
  mutation:
    uses: RemiAsselin42/claude-config/.github/workflows/mutation-gate.yml@v4
    with:
      dir: backend
