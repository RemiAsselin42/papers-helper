[project]
name = "papers-helper-backend"
version = "0.1.0"
description = "Backend API for papers-helper — local academic research tool"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.6.0",
    "ollama>=0.4.0",
    "python-multipart>=0.0.20",
    "pypdf>=6.10.2",
    "httpx>=0.28.0",
    "python-docx>=1.1.0",
    "odfpy>=1.4.0",
    "striprtf>=0.0.26",
    "ebooklib>=0.18",
    "bibtexparser==2.0.0b9",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "networkx>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "grimp>=3.14",
    "mutmut>=3.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mutmut]
# Gate 3 — mutation testing, SCOPE STRICT au seul module _bibtex (regle 14) :
# on ne MUTE que ce fichier (logique de parsing pure et deterministe).
paths_to_mutate = ["app/parsers/_bibtex.py"]
# mutmut copie le code a muter dans mutants/ et y lance les tests. Sans le reste
# du paquet, les imports des tests (app.parsers.__init__ qui importe tous les
# parsers, et app.parsers._html) casseraient. On copie donc TOUT app/ (non mute)
# pour que les tests tournent ; l'instrumentation de _bibtex est appliquee APRES
# la copie (ordre du run mutmut), donc la version mutee gagne.
also_copy = ["app"]
# Par mutant, on ne joue QUE les tests du module cible (sinon 400+ tests x N
# mutants = ingerable). test_parsers.py couvre _bibtex.
pytest_add_cli_args_test_selection = ["tests/test_parsers.py"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
