[project]
name = "papers-helper-backend"
version = "0.1.0"
description = "Backend API for papers-helper — local academic research tool"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.6.0",
    "ollama>=0.4.0",
    "python-multipart>=0.0.20",
    "pypdf>=6.10.2",
    "httpx>=0.28.0",
    "python-docx>=1.1.0",
    "odfpy>=1.4.0",
    "striprtf>=0.0.26",
    "ebooklib>=0.18",
    "bibtexparser==2.0.0b9",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "networkx>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
[tool.mutmut]
# Gate 3, mutation testing, scoped to one module: pure, deterministic parsing logic.
source_paths = ["app/parsers/_bibtex.py"]
# mutmut copies what it mutates into mutants/ and runs the tests from there; the
# tests import app.parsers (whose __init__ imports every parser), so the whole
# package is copied along, unmutated, and only _bibtex gets instrumented.
also_copy = ["app"]
# Per mutant, only the tests of the target module run: test_parsers.py covers _bibtex.
pytest_add_cli_args_test_selection = ["tests/test_parsers.py"]
